            // ---- derived: dropdown options ------------------------------------------
            const countries = useMemo(() => {
                const set = new Set(universities.map(u => u.country).filter(Boolean));
                return Array.from(set).sort();
            }, [universities]);

            const filteredCountries = useMemo(() => {
                if (!filters.continent) return countries;
                const set = new Set(
                    universities.filter(u => u.continent === filters.continent).map(u => u.country)
                );
                return Array.from(set).filter(Boolean).sort();
            }, [universities, countries, filters.continent]);

            const universityNameOptions = useMemo(() => {
                let list = universities;
                if (filters.continent) list = list.filter(u => u.continent === filters.continent);
                if (filters.country)   list = list.filter(u => u.country === filters.country);
                return ['', ...list.map(u => u.name).sort()];
            }, [universities, filters.continent, filters.country]);

            const continentOptions = useMemo(() => {
                const set = new Set(universities.map(u => u.continent).filter(Boolean));
                return Array.from(set).sort();
            }, [universities]);

            // ---- stats (fixed program totals) ----------------------------------------
            // The header summary always shows the WHOLE program — it reads as official
            // OIA totals, so it must not fluctuate with filters. The filtered result
            // count is communicated by "Found n universities" instead.
            const stats = useMemo(() => ({
                total: universities.length,
                totalQuota: universities.reduce((s,u)=>s+u.quota, 0),
                countries: new Set(universities.map(u=>u.country)).size,
                americas:   universities.filter(u => u.continent === 'Americas').length,
                asiaOceania:universities.filter(u => u.continent === 'Asia/Oceania').length,
                europe:     universities.filter(u => u.continent === 'Europe').length,
                english:    universities.filter(u => isEnglishOffered(u)).length,
                nonEnglish: universities.filter(u => isNonEnglishOffered(u)).length,
            }), [universities]);

            // ---- exports (dynamic per semester) -------------------------------------
            const exportFileBase = `${SEMESTER.yearPart}_exchange-universities`;
            const exportTitle    = `${SEMESTER.yearPart} Exchange Universities`;

            // 'pdf' | 'excel' | null — first click also downloads the CDN lib (~1-2s)
            const [exporting, setExporting] = useState(null);

            const exportToPDF = async () => {
                try {
                    setExporting('pdf');
                    await ensurePdfLibs();
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'landscape' });
                    doc.setFontSize(18);
                    doc.text(exportTitle, 14, 22);
                    doc.setFontSize(11);
                    doc.text(`Generated: ${new Date().toLocaleDateString('ko-KR')}`, 14, 30);
                    doc.text(`Total: ${sortedUniversities.length} universities`, 14, 36);

                    const dl = TermLib.activeDeadlineFields(SEMESTER.code);
                    const tableData = sortedUniversities.map(u => [
                        u.name, u.country,
                        [u.acceptsUG?'UG':null, u.acceptsGrad?'G':null].filter(Boolean).join(', ') || 'N/A',
                        u.language1 + (u.language2 ? ', ' + u.language2 : ''),
                        u.quota,
                        u.toefl ?? 'N/A',
                        u.gpaRequired ?? 'N/A',
                        [u.fallOneSemester?'Fall 1-sem':null, u.fallCalendarYear?'Fall 1-yr':null,
                         u.springOneSemester?'Spring 1-sem':null, u.springCalendarYear?'Spring 1-yr':null]
                         .filter(Boolean).join(', ') || 'N/A',
                        u[dl.nom] || 'N/A',
                        u[dl.app] || 'N/A',
                    ]);
                    doc.autoTable({
                        startY: 42,
                        head: [['University','Country','Open to','Language','Quota','TOEFL','GPA','Options',
                                'Nomination DL','Application DL']],
                        body: tableData,
                        styles: { fontSize: 6 },
                        headStyles: { fillColor: [0, 56, 118] },
                    });
                    doc.setFontSize(9);
                    doc.text('Full details (deadlines, areas, housing, notices) are available in the Excel download.',
                        14, doc.lastAutoTable.finalY + 8);
                    doc.save(`${exportFileBase}.pdf`);
                } catch (e) {
                    alert(`PDF download failed: ${e.message || e}`);
                } finally {
                    setExporting(null);
                }
            };

            const exportToExcel = async () => {
                try {
                    setExporting('excel');
                    await ensureXlsxLib();
                    const data = sortedUniversities.map(u => ({
                        'Favorite': favorites.includes(favKey(u)) ? '★' : '',
                        University: u.name,
                        Country: u.country,
                        Continent: u.continent,
                        'Open to Undergraduate': u.acceptsUG ? 'Y' : 'N',
                        'Open to Graduate': u.acceptsGrad ? 'Y' : 'N',
                        Quota: u.quota,
                        'Quota Unit': u.quotaUnit,
                        'Academic System': u.academicSystem,
                        Language: u.language1 + (u.language2 ? ', ' + u.language2 : ''),
                        'TOEFL iBT': u.toefl ?? 'Not specified',
                        'TOEFL Subscores': u.toeflSubscores,
                        'Language Level': u.lang2Level,
                        'Language Notes': u.languageOtherNotes,
                        'GPA Required': u.gpaRequired ?? 'N/A',
                        'Fall One Semester':   u.fallOneSemester  ? 'Y' : 'N',
                        'Fall Calendar Year':  u.fallCalendarYear ? 'Y' : 'N',
                        'Spring One Semester': u.springOneSemester  ? 'Y' : 'N',
                        'Spring Calendar Year':u.springCalendarYear ? 'Y' : 'N',
                        'Fall Nomination Deadline': u.fallNominationDeadline,
                        'Fall Application Deadline': u.fallApplicationDeadline,
                        'Spring Nomination Deadline': u.springNominationDeadline,
                        'Spring Application Deadline': u.springApplicationDeadline,
                        'Available Areas': u.availableAreas,
                        'Restricted Areas': u.restrictedAreas,
                        'Admission Notes': u.admissionNotes,
                        'Housing Guaranteed': u.housingGuaranteed,
                        'Housing Info': u.housingInfo,
                        'Scholarship': u.scholarship,
                        'Notice from OIA': u.notes,
                        'Transcript': u.transcriptInfo,
                        'Labels': u.labels.join(', '),
                        Website: u.website,
                        'Factsheet': u.recentFactsheet,
                        'Detail Link': `${window.location.origin}${window.location.pathname}${HashRoute.hashForSlug(u.slug)}`,
                    }));
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Universities');
                    XLSX.writeFile(wb, `${exportFileBase}.xlsx`);
                } catch (e) {
                    alert(`Excel download failed: ${e.message || e}`);
                } finally {
                    setExporting(null);
                }
            };

            // Active filter chips (T1-A) — MUST be declared before any early return
            // so the hook order stays stable across loading/error/loaded renders.
            const activeChips = useMemo(() => buildActiveChips(filters), [filters]);

            // ---- early-return states ------------------------------------------------
            if (loading) {
                return (
                    <div className="loading-state">
                        <div className="spinner"></div>
                        <p>Loading data…</p>
                    </div>
                );
            }
            if (error) {
                return (
                    <div className="error-state">
                        <div className="error-state-icon" aria-hidden="true"><IconAlert /></div>
                        <div className="error-state-text">Failed to load data.</div>
                        <div className="error-state-detail">{error}</div>
                        <button className="error-retry-btn" onClick={loadData}>Try again</button>
                    </div>
                );
            }

            const clearAllFilters = () => {
                setFilters(DEFAULT_FILTERS);
                sessionStorage.removeItem(`${TERM_SK}filters`);
            };

            const removeChip = (reset) => setFilters(prev => ({ ...prev, ...reset }));

            // ============================== RENDER ===================================
            return (
                <>
                    <a href="#main" className="skip-link">Skip to content</a>

                    <header className="site-header">
                        <div className="site-header__inner">
                            <a href="#" className="site-header__brand-group" aria-label="Home">
                                <img
                                    src="/assets/yonsei-logo.png"
                                    alt="Yonsei University"
                                    className="site-header__logo"
                                    translate="no" />
                                <div className="site-header__org-text">
                                    <strong>{IS_SEASONAL ? '계절학기 해외파견 배정 가능 대학' : `${SEMESTER.korean} 해외파견 배정 가능 대학`}</strong>
                                    <span translate="no">Yonsei University · Office of International Affairs</span>
                                </div>
                            </a>
                            {IS_SEASONAL
                                ? <a href="/" className="cross-nav">&larr; OIA UnivFinder</a>
                                : <a href="/seasonal/" className="cross-nav">Summer/Winter Finder &rarr;</a>}
                            {HEADER_LINKS.length > 0 && (
                                <nav className="site-nav" aria-label="Related links">
                                    {HEADER_LINKS.map(l => (
                                        <a key={l.label} href={safeHttpUrl(l.url)} target="_blank" rel="noopener noreferrer"
                                            className="site-nav__tab">
                                            {l.label}
                                        </a>
                                    ))}
                                </nav>
                            )}
                            <a
                                href="https://oia.yonsei.ac.kr"
                                target="_blank"
                                rel="noopener noreferrer"
                                className="site-header__external">
                                OIA Official Website
                                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                                    <path d="M3 3h6v6M3 9l6-6"
                                        stroke="currentColor" strokeWidth="1.5"
                                        strokeLinecap="round" strokeLinejoin="round" />
                                </svg>
                            </a>
                        </div>
                    </header>

                    <section className="hero" aria-labelledby="page-title">
                        <div className="hero__inner">
                            <div className="hero__top">
                                <p className="hero__eyebrow">
                                    {IS_SEASONAL ? 'Yonsei OIA · Seasonal Programs' : `Exchange University Finder · ${SEMESTER.full}`}
                                </p>
                                {visits && (
                                    <div className="hero__counter" aria-label="Visitor count">
                                        <span className="hero__counter-item">
                                            <span className="hero__counter-label">TODAY</span>
                                            <strong>{visits.today.toLocaleString()}</strong>
                                        </span>
                                        <span className="hero__counter-sep" aria-hidden="true">·</span>
                                        <span className="hero__counter-item">
                                            <span className="hero__counter-label">TOTAL</span>
                                            <strong>{visits.total.toLocaleString()}</strong>
                                        </span>
                                    </div>
                                )}
                            </div>
                            <h1 id="page-title" className="hero__title">
                                {IS_SEASONAL ? (seasonalConfig.season_label || 'Seasonal Program') : '해외파견 프로그램 배정 가능 대학'}
                            </h1>
                            <p className="hero__subtitle">
                                {IS_SEASONAL ? 'Seasonal Program Finder' : 'List of Host Universities for Yonsei Outbound Exchange Program'}
                            </p>
                            <p className="hero__lede">
                                {IS_SEASONAL
                                    ? 'Short-term Summer and Winter programs at Yonsei OIA partner universities, separate from the regular semester exchange. Search by university or program name, and open a program for fees, scholarship, and eligibility details.'
                                    : '연세대학교 국제처가 운영하는 교환학생 프로그램에서 지원 가능한 해외 파트너 대학 명단입니다. 대륙·언어·학점·어학 요건으로 좁혀 검색하고, 관심 학교는 즐겨찾기에 담아 비교해 보세요.'}
                            </p>
                            <dl className="hero__meta">
                                {IS_SEASONAL ? (
                                    // Hide the program counts while the season is being prepared
                                    // (is_live === false) — the list itself is already hidden below.
                                    seasonalConfig && seasonalConfig.is_live === false ? null : (
                                    <>
                                        <div><dt>Programs</dt><dd>{programs.length}</dd></div>
                                        <div><dt>Quota</dt><dd>{programs.reduce((s,p)=>s+(Number(p.quota)||0), 0)}</dd></div>
                                        <div><dt>Countries</dt><dd>{new Set(programs.map(p=>p.country).filter(Boolean)).size}</dd></div>
                                    </>
                                    )
                                ) : (
                                    <>
                                        <div><dt>Total</dt><dd>{stats.total}</dd></div>
                                        <div><dt>Quota</dt><dd>{stats.totalQuota}</dd></div>
                                        <div><dt>Countries</dt><dd>{stats.countries}</dd></div>
                                        <div><dt>Americas</dt><dd>{stats.americas}</dd></div>
                                        <div><dt>Asia/Oceania</dt><dd>{stats.asiaOceania}</dd></div>
                                        <div><dt>Europe</dt><dd>{stats.europe}</dd></div>
                                        <div><dt>English</dt><dd>{stats.english}</dd></div>
                                        <div><dt>Non-English</dt><dd>{stats.nonEnglish}</dd></div>
                                    </>
                                )}
                            </dl>
                        </div>
                    </section>

                    <div className="notice-bar">
                        <div className="notice-inner">
                            {IS_SEASONAL ? (
                                <>
                                    <p>
                                        <strong>유의사항:</strong> 이 목록은 하계(Summer)·동계(Winter) 계절학기 프로그램으로, 정규 학기 교환학생(Regular semester exchange)과는 별도로 운영됩니다. 학비, 장학금, 마감일 등 세부 조건은 변경될 수 있으니 지원 전 국제처 공지사항을 통해 최종 확인하시기 바랍니다.
                                    </p>
                                    <p>
                                        <strong>Notice:</strong> This list shows short-term Summer and Winter seasonal programs, separate from the regular semester exchange. Program fees, scholarships, and deadlines are subject to change; please confirm final details through the OIA notice board before applying.
                                    </p>
                                </>
                            ) : (
                                <>
                                    <p>
                                        <strong>유의사항:</strong> 연세대학교 국제처와 교환학생 협정을 맺은 해외 대학 목록입니다. 일부 단과대학 단독 교환 프로그램을 운영하는 대학은 검색되지 않을 수 있으므로, 해당 경우는 소속 단과대학으로 문의 바랍니다. 교환대학의 모집 인원, 지원 자격, 세부 조건은 매 학기 변경될 수 있습니다. 또한, 여기에 안내된 어학 성적 및 GPA 기준은 최소 요건이며, 최종 선발 여부는 상대교의 심사를 통해 결정됩니다.
                                    </p>
                                    <p>
                                        <strong>Notice:</strong> This list shows OIA partner universities with student exchange agreements through Yonsei University's Office of International Affairs. Some colleges or departments that operate exchange programs exclusively may not appear in this list; in such cases, please contact your college or department for further information. Exchange conditions may change each semester. The language proficiency and GPA requirements listed here represent the minimum requirements; final admission decisions are made by the host institution.
                                    </p>
                                    {usingMock && (
                                        <p style={{marginTop:8, color:'#a06000'}}>
                                            <strong>(개발 모드)</strong> 현재 mock 데이터로 동작 중입니다. Google Sheets URL이 코드에 설정되지 않았습니다.
                                        </p>
                                    )}
                                </>
                            )}
                        </div>
                    </div>

                    <main id="main" className="container">
                      {!IS_SEASONAL && (
                        <>
                        {/* ===== First-visit banner (T2-I) ===== */}
                        {showFirstVisitBanner && (
                            <div className="first-visit-banner">
                                <span className="first-visit-icon" aria-hidden="true"><IconLightbulb /></span>
                                <span className="first-visit-text">
                                    <strong>New here?</strong> Set your <strong>Student Type, Language, and GPA</strong> below to narrow the list quickly. Star ☆ the schools you want to keep.
                                </span>
                                <button className="first-visit-close" onClick={dismissFirstVisitBanner} aria-label="Dismiss tip">×</button>
                            </div>
                        )}

                        {/* ===== Mobile filter trigger (T2-H) ===== */}
                        <button className="mobile-filter-trigger"
                            onClick={() => setIsFilterDrawerOpen(true)}
                            aria-label="Open filters">
                            <span className="mobile-filter-trigger-icon" aria-hidden="true"><IconFilter /></span>
                            Filters
                            {activeChips.length > 0 && (
                                <span className="mobile-filter-trigger-count">{activeChips.length}</span>
                            )}
                        </button>

                        {/* Mobile drawer backdrop */}
                        <div
                            className={`filter-drawer-backdrop ${isFilterDrawerOpen ? 'is-open' : ''}`}
                            onClick={() => setIsFilterDrawerOpen(false)}
                            aria-hidden="true" />

                        {/* ===== Filter Panel (drawer on mobile, inline on desktop) ===== */}
                        <section className={`filter-panel ${isFilterDrawerOpen ? 'is-open' : ''}`}>
                            <div className="filter-drawer-header">
                                <span className="filter-drawer-title">Filters</span>
                                <button className="filter-drawer-close"
                                    onClick={() => setIsFilterDrawerOpen(false)}
                                    aria-label="Close filters">
                                    ×
                                </button>
                            </div>
                            {/* Student Type */}
                            <div className="filter-section">
                                <span className="filter-label" id="fl-student-type">Student Type</span>
                                <div className="filter-group" role="group" aria-labelledby="fl-student-type">
                                    {['Undergraduate','Graduate'].map(t => (
                                        <button key={t}
                                            className={`filter-btn ${filters.studentType===t?'active':''}`}
                                            onClick={() => setFilters(p => ({...p, studentType: p.studentType===t?'':t}))}>
                                            {t}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Language Region */}
                            <div className="filter-section">
                                <span className="filter-label" id="fl-language-region">Language Region (Select One)</span>
                                <div className="filter-group" role="group" aria-labelledby="fl-language-region">
                                    {['English','Non-English'].map(t => (
                                        <button key={t}
                                            className={`filter-btn ${filters.languageRegion===t?'active':''}`}
                                            onClick={() => setFilters(p => ({...p, languageRegion: p.languageRegion===t?'':t}))}>
                                            {t}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Semester Option — only the active term's options (derived from
                                SEMESTER_CODE). Single-select: combining lengths is a union and
                                reads as a wrong count, so picking one clears the other. */}
                            <div className="filter-section">
                                <span className="filter-label" id="fl-term">Exchange Term &amp; Length (select one)</span>
                                <div className="filter-group" role="group" aria-labelledby="fl-term">
                                    {TermLib.semesterOptions(SEMESTER.code).map(opt => (
                                        <button key={opt.key}
                                            className={`filter-btn ${filters[opt.key]?'active':''}`}
                                            onClick={() => setFilters(p => {
                                                const next = {...p};
                                                TermLib.semesterOptions(SEMESTER.code).forEach(o => { next[o.key] = false; });
                                                next[opt.key] = !p[opt.key];
                                                return next;
                                            })}>
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Continent & Country */}
                            <div className="filter-section">
                                <span className="filter-label">Continent &amp; Country</span>
                                <div className="input-group">
                                    <div className="input-field">
                                        <label htmlFor="f-continent">Continent</label>
                                        <select id="f-continent" value={filters.continent}
                                            onChange={(e)=>setFilters(p=>({...p, continent:e.target.value, country:'', university:''}))}>
                                            <option value="">All Continents</option>
                                            {continentOptions.map(c => (
                                                <option key={c} value={c}>{c}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="input-field">
                                        <label htmlFor="f-country">Country</label>
                                        <select id="f-country" value={filters.country}
                                            onChange={(e)=>setFilters(p=>({...p, country:e.target.value, university:''}))}>
                                            <option value="">All Countries</option>
                                            {filteredCountries.map(c => (
                                                <option key={c} value={c}>{c}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* University Search */}
                            <div className="filter-section">
                                <label className="filter-label" htmlFor="f-university">Search University</label>
                                <div className="input-field">
                                    <select id="f-university" value={filters.university}
                                        onChange={(e)=>setFilters(p=>({...p, university:e.target.value}))}>
                                        <option value="">All Universities</option>
                                        {universityNameOptions.filter(Boolean).map(n => <option key={n} value={n}>{n}</option>)}
                                    </select>
                                </div>
                                <div className="input-field" style={{marginTop:10}}>
                                    <input type="text" placeholder="Type university or country to search…"
                                        aria-label="Search university by name or country"
                                        autoComplete="off" spellCheck={false}
                                        value={filters.universitySearch}
                                        onChange={(e)=>setFilters(p=>({...p, universitySearch:e.target.value}))} />
                                </div>
                            </div>

                            {/* My Qualifications */}
                            <div className="filter-section">
                                <span className="filter-label">My Qualifications</span>
                                <div className="input-group">
                                    <div className="input-field">
                                        <label htmlFor="f-gpa">GPA (4.3 scale)</label>
                                        <input id="f-gpa" type="number" step="0.01" min="0" max="4.3"
                                            inputMode="decimal"
                                            placeholder="e.g., 3.5"
                                            value={filters.gpa}
                                            onChange={(e)=>setFilters(p=>({...p, gpa:e.target.value}))} />
                                        {gpaWarning && <div className="warning-text" role="alert">{gpaWarning}</div>}
                                    </div>

                                    {filters.languageRegion === 'English' && (
                                        <div className="input-field">
                                            <label htmlFor="f-toefl">TOEFL iBT</label>
                                            <input id="f-toefl" type="number" min="0" max="120" placeholder="e.g., 90"
                                                inputMode="numeric"
                                                value={filters.toefl}
                                                onChange={(e)=>setFilters(p=>({...p, toefl:e.target.value}))} />
                                            {toeflWarning && <div className="warning-text" role="alert">{toeflWarning}</div>}
                                        </div>
                                    )}

                                    {filters.languageRegion === 'Non-English' && (
                                        <>
                                            <div className="input-field">
                                                <label htmlFor="f-lang">Language</label>
                                                <select id="f-lang" value={filters.nonEnglishLanguage}
                                                    onChange={(e)=>setFilters(p=>({...p, nonEnglishLanguage:e.target.value, nonEnglishLevel:''}))}>
                                                    <option value="">Select Language</option>
                                                    {Object.keys(LANGUAGE_LEVEL_OPTIONS).map(l => <option key={l} value={l}>{l}</option>)}
                                                </select>
                                            </div>
                                            {filters.nonEnglishLanguage && (
                                                <div className="input-field">
                                                    <label htmlFor="f-lang-level">{filters.nonEnglishLanguage} Level</label>
                                                    <select id="f-lang-level" value={filters.nonEnglishLevel}
                                                        onChange={(e)=>setFilters(p=>({...p, nonEnglishLevel:e.target.value}))}>
                                                        <option value="">Select Level</option>
                                                        {LANGUAGE_LEVEL_OPTIONS[filters.nonEnglishLanguage].map(lv =>
                                                            <option key={lv} value={lv}>{lv}</option>)}
                                                    </select>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>

                            {/* Toggle checkboxes */}
                            <div className="filter-section">
                                <div className="checkbox-list">
                                    <label className="checkbox-row">
                                        <input type="checkbox" checked={filters.uicOnly}
                                            onChange={(e)=>setFilters(p=>({...p, uicOnly:e.target.checked, uicExclude:false}))} />
                                        <span>UIC Exclusive Programs Only</span>
                                    </label>
                                    <label className="checkbox-row">
                                        <input type="checkbox" checked={filters.uicExclude}
                                            onChange={(e)=>setFilters(p=>({...p, uicExclude:e.target.checked, uicOnly:false}))} />
                                        <span>Exclude UIC Exclusive Programs</span>
                                    </label>
                                    <label className="checkbox-row">
                                        <input type="checkbox" checked={filters.scholarshipOnly}
                                            onChange={(e)=>setFilters(p=>({...p, scholarshipOnly:e.target.checked}))} />
                                        <span>Scholarship Available Only</span>
                                    </label>
                                    <label className="checkbox-row">
                                        <input type="checkbox" checked={filters.updateOnly}
                                            onChange={(e)=>setFilters(p=>({...p, updateOnly:e.target.checked}))} />
                                        <span style={{color:'#e83e8c'}}>Updated Universities Only</span>
                                    </label>
                                </div>
                            </div>

                            {/* Buttons: reset → view toggles → favorites actions → info */}
                            <div style={{display:'flex', justifyContent:'center', gap:10, marginTop:20, flexWrap:'wrap'}}>
                                <button className="btn btn-secondary" onClick={clearAllFilters}>
                                    Clear All Filters
                                </button>
                                <button
                                    className={`btn ${showFavoritesOnly?'btn-primary':'btn-secondary'}`}
                                    onClick={()=>setShowFavoritesOnly(v=>!v)}>
                                    {showFavoritesOnly ? '★ Showing Favorites' : '☆ Show Favorites Only'} ({favorites.length})
                                </button>
                                <button
                                    className={`btn ${hideNotRecruiting?'btn-primary':'btn-secondary'}`}
                                    onClick={()=>setHideNotRecruiting(v=>!v)}>
                                    {hideNotRecruiting ? 'Showing Recruiting Only' : 'Hide Not Recruiting'}
                                </button>
                                {favorites.length > 0 && (
                                    <button className="btn btn-secondary btn-danger-text" onClick={clearAllFavorites}>
                                        Clear All Favorites
                                    </button>
                                )}
                                <button className="btn btn-secondary" onClick={()=>setShowUpdateHistory(true)}>
                                    <span className="btn-icon" aria-hidden="true"><IconClipboard /></span>
                                    Update History
                                </button>
                            </div>
                        </section>

                        {/* ===== Active Filter Chips (T1-A) ===== */}
                        {activeChips.length > 0 && (
                            <div className="active-chips" role="region" aria-label="Active filters">
                                <span className="active-chips-label">Active filters</span>
                                {activeChips.map(chip => (
                                    <button key={chip.key} className="active-chip"
                                        onClick={() => removeChip(chip.reset)}
                                        aria-label={`Remove ${chip.label} filter`}>
                                        <span>{chip.label}</span>
                                        <span className="active-chip-x" aria-hidden="true">×</span>
                                    </button>
                                ))}
                                <button className="active-chip-clear" onClick={clearAllFilters}>
                                    Clear all
                                </button>
                            </div>
                        )}

                        {/* ===== Action Bar ===== */}
                        <div className="action-bar">
                            <div className="result-count" aria-live="polite">
                                Found <strong>{sortedUniversities.length}</strong> universities
                            </div>
                            <div className="action-buttons">
                                <select className="sort-select" aria-label="Sort universities"
                                    value={sortBy} onChange={(e)=>setSortBy(e.target.value)}>
                                    <option value="quota-desc">Quota (High to Low)</option>
                                    <option value="quota-asc">Quota (Low to High)</option>
                                    <option value="name-asc">University Name (A-Z)</option>
                                    <option value="name-desc">University Name (Z-A)</option>
                                    <option value="toefl-asc">TOEFL (Low to High)</option>
                                    <option value="toefl-desc">TOEFL (High to Low)</option>
                                    <option value="gpa-asc">GPA (Low to High)</option>
                                    <option value="gpa-desc">GPA (High to Low)</option>
                                </select>
                                <button type="button" className="btn btn-secondary"
                                    onClick={exportToPDF}
                                    disabled={sortedUniversities.length === 0 || exporting !== null}>
                                    {exporting === 'pdf' ? 'Preparing…' : 'Download PDF'}
                                </button>
                                <button type="button" className="btn btn-secondary"
                                    onClick={exportToExcel}
                                    disabled={sortedUniversities.length === 0 || exporting !== null}>
                                    {exporting === 'excel' ? 'Preparing…' : 'Download Excel'}
                                </button>
                            </div>
                        </div>

                        {/* ===== Grid ===== */}
                        {sortedUniversities.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-state-icon" aria-hidden="true"><IconSearch /></div>
                                <div className="empty-state-text">
                                    No universities match your criteria. Try adjusting your filters.
                                </div>
                            </div>
                        ) : (
                            <div className="university-grid">
                                {sortedUniversities.map(u => (
                                    <UniversityCard
                                        key={favKey(u)} u={u}
                                        isFavorited={favorites.includes(favKey(u))}
                                        onToggleFavorite={() => toggleFavorite(favKey(u))}
                                        onOpenDetail={() => setSelectedUniversity(u)} />
                                ))}
                            </div>
                        )}
                        </>
                      )}
                      {IS_SEASONAL && (
                        <SeasonalMain
                            programs={programs}
                            search={programSearch}
                            onSearchChange={setProgramSearch}
                            onOpenDetail={setSelectedProgram}
                            seasonalConfig={seasonalConfig}
                            onOpenUpdateHistory={() => setShowUpdateHistory(true)} />
                      )}
                    </main>

                    {/* ===== Detail Modal ===== */}
                    {selectedUniversity && (
                        <DetailModal
                            u={selectedUniversity}
                            onClose={() => { setSelectedUniversity(null); setCameFromUpdateHistory(false); }}
                            cameFromUpdateHistory={cameFromUpdateHistory}
                            onBack={() => {
                                setSelectedUniversity(null);
                                setShowUpdateHistory(true);
                                setCameFromUpdateHistory(false);
                            }}
                            linkify={linkify}
                            onPrev={() => navigateModal(-1)}
                            onNext={() => navigateModal(1)}
                            hasPrev={modalIdx > 0}
                            hasNext={modalIdx >= 0 && modalIdx < sortedUniversities.length - 1}
                            modalIdx={modalIdx}
                            modalTotal={sortedUniversities.length} />
                    )}

                    {/* ===== Seasonal Detail Modal ===== */}
                    {IS_SEASONAL && selectedProgram && (
                        <SeasonalDetailModal
                            p={selectedProgram}
                            onClose={() => setSelectedProgram(null)} />
                    )}

                    {/* ===== Update History Modal (seasonal uses its own; regular untouched) ===== */}
                    {showUpdateHistory && (IS_SEASONAL ? (
                        <SeasonalUpdateHistoryModal
                            programs={programs}
                            onClose={() => setShowUpdateHistory(false)}
                            onPickProgram={(p) => { setShowUpdateHistory(false); setSelectedProgram(p); }} />
                    ) : (
                        <UpdateHistoryModal
                            universities={universities}
                            onClose={() => setShowUpdateHistory(false)}
                            onPickUniversity={(u) => {
                                setShowUpdateHistory(false);
                                setSelectedUniversity(u);
                                setCameFromUpdateHistory(true);
                            }} />
                    ))}

                    <button className={`scroll-to-top ${showScrollTop?'visible':''}`} onClick={scrollToTop} aria-label="Scroll to top">
                        ↑
                    </button>

                    <footer className="site-footer">
                        <p>© 2026 Yonsei University, Office of International Affairs · Developed by Seo-Ah Choi 최서아</p>
                        <p className="footer-notice">
                            본 사이트의 파견교 데이터는 연세대학교 국제처가 관리하며, 사전 허가 없는 자동 수집(크롤링)·복제·재배포를 금지합니다.
                        </p>
                        <p className="footer-notice footer-notice-en">
                            Data is maintained by the Office of International Affairs, Yonsei University.
                            Unauthorized crawling, reproduction, or redistribution is prohibited.
                        </p>
                        <p>
                            문의 Contact: <a href="mailto:abroad@yonsei.ac.kr">abroad@yonsei.ac.kr</a>
                            {' · '}
                            <a href="/terms" target="_blank" rel="noopener noreferrer">이용안내 Terms of Use</a>
                        </p>
                    </footer>
                </>
            );
        }

        // =========================================================================
        // Sub-components
        // =========================================================================
        function Stat({ label, value }) {
            return (
                <div className="stat-item">
                    <div className="stat-label">{label}</div>
                    <div className="stat-value">{value}</div>
                </div>
            );
        }

        function LabelTag({ label, size }) {
            const s = UF.labelStyle(label);
            return (
                <span className={`label-tag ${size==='large'?'large':''}`}
                      style={{ background: s.bg, color: s.color, border: s.border }}>
                    {label}
                </span>
            );
        }

        function UniversityCard({ u, isFavorited, onToggleFavorite, onOpenDetail }) {
            const isEnglish = u.language1 === 'English';
            return (
                <div className={`university-card ${isFavorited?'favorited':''} ${TermLib.isRecruiting(u, SEMESTER.code)?'':'is-norecruit'}`}>
                    <div className="card-header">
                        <div className="university-name">
                            {u.name}
                            {u.labels.length > 0 && (
                                <span className="card-labels">
                                    {u.labels.map(l => <LabelTag key={l} label={l} />)}
                                </span>
                            )}
                        </div>
                        <div className="card-actions">
                            <button className={`icon-btn ${isFavorited?'active':''}`}
                                onClick={onToggleFavorite}
                                aria-label={isFavorited ? `Remove ${u.name} from favorites` : `Add ${u.name} to favorites`}
                                aria-pressed={isFavorited}
                                title="Favorite">
                                {isFavorited?'★':'☆'}
                            </button>
                        </div>
                    </div>

                    <div className="card-meta">
                        <div className="meta-item">
                            <span className="meta-icon" aria-hidden="true">{COUNTRY_FLAGS[u.country] || <IconGlobe />}</span>
                            {u.country}
                        </div>
                        <div className="meta-item">
                            <span className="meta-icon" aria-hidden="true"><IconUsers /></span>
                            {TermLib.isRecruiting(u, SEMESTER.code)
                                ? <>{u.quota} {u.quotaUnit ? `(${u.quotaUnit})` : ''}</>
                                : <span className="yz-norecruit-badge">Not recruiting this term</span>}
                        </div>
                        <div className="meta-item">
                            <span className="meta-icon" aria-hidden="true"><IconMessage /></span>
                            {[u.language1, u.language2].filter(Boolean).join(', ') || '—'}
                        </div>
                    </div>

                    <div className="card-specs">
                        <div className="spec-item">
                            <div className="spec-label">{isEnglish ? 'TOEFL iBT' : 'Language Requirement'}</div>
                            <div className="spec-value" style={{fontSize: isEnglish?14:12}}>
                                {isEnglish
                                    ? (u.toefl ?? 'Not specified')
                                    : (u.lang2Level || u.language2 || 'Not specified')}
                            </div>
                        </div>
                        <div className="spec-item">
                            <div className="spec-label">GPA Required (4.3)</div>
                            <div className="spec-value">{u.gpaRequired ?? 'Not specified'}</div>
                        </div>
                        <div className="spec-item">
                            <div className="spec-label">Semester Options</div>
                            <div className="spec-value" style={{fontSize:11}}>
                                {[
                                    u.fallOneSemester?'Fall 1-sem':null,
                                    u.fallCalendarYear?'Fall 1-yr':null,
                                    u.springOneSemester?'Spring 1-sem':null,
                                    u.springCalendarYear?'Spring 1-yr':null,
                                ].filter(Boolean).join(', ') || 'N/A'}
                            </div>
                        </div>
                        <div className="spec-item">
                            <div className="spec-label">Academic System</div>
                            <div className="spec-value">{u.academicSystem || 'N/A'}</div>
                        </div>
                    </div>

                    <div style={{marginTop:15, display:'flex', gap:10}}>
                        <button className="btn btn-primary" style={{flex:1, fontSize:13, padding:'8px 12px'}}
                            onClick={onOpenDetail}>
                            View Details
                        </button>
                        {u.website && (
                            <a href={safeHttpUrl(u.website)} target="_blank" rel="noopener noreferrer"
                                className="btn btn-secondary" style={{flex:1, fontSize:13, padding:'8px 12px'}}>
                                Website
                            </a>
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // Seasonal (Summer/Winter) mode — search + card grid.
        // Mirrors the regular grid's visual language (university-card, card-meta,
        // card-specs, btn classes) but reads from `programs`, not `universities`.
        // =========================================================================
        function SeasonalMain({ programs, search, onSearchChange, onOpenDetail, seasonalConfig, onOpenUpdateHistory }) {
            // ESP/VSP type filter — '' = all (mirrors the regular Student Type
            // toggle: single-select, click the active one again to clear).
            const [typeFilter, setTypeFilter] = useState('');
            const filtered = useMemo(() => {
                const q = searchNorm(search.trim());
                return programs.filter(p => {
                    const matchesSearch = !q ||
                        searchNorm(`${p.university_name} ${p.program_name} ${p.country}`).includes(q);
                    const matchesType = !typeFilter || SeasonalLib.seasonalTypeOf(p) === typeFilter;
                    return matchesSearch && matchesType;
                });
            }, [programs, search, typeFilter]);

            // Spec §7: while a season is being prepared (config.is_live === false,
            // explicitly, not the {} default during initial load), show a coming-soon
            // notice instead of the search + grid.
            if (seasonalConfig && seasonalConfig.is_live === false) {
                return (
                    <div className="empty-state" role="status">
                        <div className="empty-state-icon" aria-hidden="true"><IconCalendar /></div>
                        <div className="empty-state-text">
                            <strong>{seasonalConfig.season_label || 'Seasonal Programs'}</strong>
                            <div style={{marginTop: 8}}>
                                The seasonal program list is being prepared. Please check back soon.
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <>
                    <div className="filter-panel" style={{marginBottom: 20}}>
                        <div className="filter-section">
                            <label className="filter-label" htmlFor="f-seasonal-search">Search University or Program</label>
                            <div className="input-field" style={{marginTop: 8}}>
                                <input id="f-seasonal-search" type="text"
                                    placeholder="Type university or program name…"
                                    aria-label="Search seasonal programs by university or program name"
                                    autoComplete="off" spellCheck={false}
                                    value={search}
                                    onChange={(e) => onSearchChange(e.target.value)} />
                            </div>
                        </div>
                        <div className="filter-section">
                            <span className="filter-label" id="fl-seasonal-type">Program Type</span>
                            <div className="filter-group" role="group" aria-labelledby="fl-seasonal-type">
                                {['ESP', 'VSP'].map(t => (
                                    <button key={t}
                                        className={`filter-btn ${typeFilter === t ? 'active' : ''}`}
                                        onClick={() => setTypeFilter(prev => prev === t ? '' : t)}>
                                        {t}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="action-bar">
                        <div className="result-count" aria-live="polite">
                            Found <strong>{filtered.length}</strong> programs
                        </div>
                        {programs.some(p => p.updates && p.updates.length > 0) && (
                            <button className="btn btn-secondary" onClick={()=>onOpenUpdateHistory()}>
                                Update History
                            </button>
                        )}
                    </div>

                    {filtered.length === 0 ? (
                        <div className="empty-state">
                            <div className="empty-state-icon" aria-hidden="true"><IconSearch /></div>
                            <div className="empty-state-text">
                                No programs match your search. Try a different keyword.
                            </div>
                        </div>
                    ) : (
                        <div className="university-grid">
                            {filtered.map(p => (
                                <SeasonalCard key={p.slug} p={p} onOpenDetail={() => onOpenDetail(p)} />
                            ))}
                        </div>
                    )}
                </>
            );
        }

        function SeasonalCard({ p, onOpenDetail }) {
            const typeLabel = SeasonalLib.programTypeLabel(p.program_type);
            return (
                <div className="university-card">
                    <div className="card-header">
                        <div className="university-name">
                            <div style={{display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap'}}>
                                <span>{p.university_name}</span>
                                <span className={`seasonal-badge seasonal-badge--${p.program_type === 'VSP' ? 'vsp' : 'esp'}`}
                                    title={typeLabel.full}>
                                    {typeLabel.short}
                                </span>
                            </div>
                            <div style={{fontSize: 13, fontWeight: 500, color: 'var(--ink-muted)', marginTop: 2}}>
                                {p.program_name}
                            </div>
                            {(p.labels && p.labels.length > 0) && (
                                <div style={{display:'flex', gap:6, flexWrap:'wrap', marginTop:6}}>
                                    {p.labels.map(l => (
                                        <span key={l} style={(function(s){return {
                                            background:s.bg, color:s.color, border:s.border,
                                            fontSize:11, fontWeight:700, padding:'2px 8px',
                                            borderRadius:999, display:'inline-block'};})(UF.labelStyle(l))}>{l}</span>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="card-meta">
                        <div className="meta-item">
                            <span className="meta-icon" aria-hidden="true">{COUNTRY_FLAGS[p.country] || <IconGlobe />}</span>
                            {p.country}
                        </div>
                        {p.program_dates && (
                            <div className="meta-item">
                                <span className="meta-icon" aria-hidden="true"><IconCalendar /></span>
                                {p.program_dates}
                            </div>
                        )}
                    </div>

                    <div className="card-specs">
                        <div className="spec-item">
                            <div className="spec-label">Application Deadline</div>
                            <div className="spec-value" style={{fontSize: 13}}>{p.application_deadline || 'TBA'}</div>
                        </div>
                        <div className="spec-item">
                            <div className="spec-label">Quota</div>
                            <div className="spec-value">{p.quota ? `${p.quota} ${p.quota_unit || ''}`.trim() : 'TBA'}</div>
                        </div>
                    </div>

                    <div style={{marginTop: 15, display: 'flex', gap: 10}}>
                        <button className="btn btn-primary" style={{flex: 1, fontSize: 13, padding: '8px 12px'}}
                            onClick={onOpenDetail}>
                            View Details
                        </button>
                        {p.website && (
                            <a href={safeHttpUrl(p.website)} target="_blank" rel="noopener noreferrer"
                                className="btn btn-secondary" style={{flex: 1, fontSize: 13, padding: '8px 12px'}}>
                                Website
                            </a>
                        )}
                    </div>
                </div>
            );
        }

        // ── Feather-style inline icons (react-icons cannot be npm-imported in a
        //    no-build UMD page; these match the Feather paths used in the mockups) ──
        const IconBookOpen = () => <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const IconCalendar = () => <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;

        // Dialog focus management — move focus into the dialog on open, keep Tab
        // cycling inside it, and return focus to the opener on close. Runs once
        // per mount, so prev/next navigation inside DetailModal does not re-steal focus.
        function useModalFocus() {
            const ref = React.useRef(null);
            useEffect(() => {
                const node = ref.current;
                if (!node) return;
                const opener = document.activeElement;
                node.focus();
                const onKeyDown = (e) => {
                    if (e.key !== 'Tab') return;
                    const focusables = node.querySelectorAll(
                        'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'
                    );
                    if (!focusables.length) return;
                    const first = focusables[0];
                    const last = focusables[focusables.length - 1];
                    if (e.shiftKey && (document.activeElement === first || document.activeElement === node)) {
                        e.preventDefault(); last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault(); first.focus();
                    }
                };
                node.addEventListener('keydown', onKeyDown);
                return () => {
                    node.removeEventListener('keydown', onKeyDown);
                    if (opener && typeof opener.focus === 'function') opener.focus();
                };
            }, []);
            return ref;
        }

            return String(text).split(splitRe).map((part, i) =>
                urlRe.test(part)
                    ? <a key={i} href={safeHttpUrl(part)} target="_blank" rel="noopener noreferrer"
                         style={{color:'var(--brand)', textDecoration:'underline'}}>{part}</a>
                    : part);
        }

                </>
            );
        }

        function InfoItem({ label, value }) {
            return (
                <div className="info-item">
                    <div className="info-label">{label}</div>
                    <div className="info-value">{value}</div>
                </div>
            );
        }

        function UpdateHistoryModal({ universities, onClose, onPickUniversity }) {
            const modalRef = useModalFocus();
            const rows = universities
                .flatMap(u => (u.updates || []).map(e => ({ entry: e, u })))
                .sort((a, b) => (a.entry.date < b.entry.date ? 1 : -1))
                .slice(0, 100);
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e)=>e.stopPropagation()} style={{maxWidth:800}}
                        role="dialog" aria-modal="true" aria-label="Update History"
                        tabIndex={-1} ref={modalRef}>
                        <div className="modal-header" style={{position:'relative'}}>
                            <button className="modal-close-btn" onClick={onClose} aria-label="Close">×</button>
                            <h2 style={{fontSize:20, fontWeight:700, display:'flex', alignItems:'center', gap:8}}>
                                <span className="modal-title-icon" aria-hidden="true"><IconClipboard /></span>
                                Update History
                            </h2>
                        </div>
                        <div className="modal-body" style={{maxHeight:'60vh', overflowY:'auto'}}>
                            {rows.length === 0 ? (
                                <p style={{textAlign:'center', color:'var(--gray-500)', padding:40}}>
                                    No update history available.
                                </p>
                            ) : (
                                <table style={{width:'100%', borderCollapse:'collapse', fontSize:14}}>
                                    <thead>
                                        <tr style={{borderBottom:'2px solid var(--gray-300)', textAlign:'left'}}>
                                            <th style={{padding:'12px 8px', width:120}}>Date</th>
                                            <th style={{padding:'12px 8px'}}>University</th>
                                            <th style={{padding:'12px 8px'}}>Country</th>
                                            <th style={{padding:'12px 8px'}}>Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {rows.map(({ entry, u }, i) => (
                                            <tr key={i}
                                                style={{borderBottom:'1px solid var(--gray-200)', cursor:'pointer'}}
                                                role="button" tabIndex={0}
                                                aria-label={`Open ${u.name} details`}
                                                onClick={() => onPickUniversity(u)}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter' || e.key === ' ') {
                                                        e.preventDefault();
                                                        onPickUniversity(u);
                                                    }
                                                }}
                                                onMouseEnter={(e)=>e.currentTarget.style.backgroundColor='var(--gray-100)'}
                                                onMouseLeave={(e)=>e.currentTarget.style.backgroundColor='transparent'}>
                                                <td style={{padding:'12px 8px', color:'var(--gray-500)'}}>{entry.date}</td>
                                                <td style={{padding:'12px 8px', color:'var(--yonsei-blue)', fontWeight:600}}>{u.name}</td>
                                                <td style={{padding:'12px 8px'}}>{u.country || '-'}</td>
                                                <td style={{padding:'12px 8px'}}>{UF.describeEntry(entry)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                        <div className="modal-footer">
                            <button className="btn btn-secondary" onClick={onClose}>Close</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Seasonal counterpart of UpdateHistoryModal — same table design as the
        // regular modal (muted date, yonsei-blue name, clipboard header), fed by
        // the seasonal feed via SeasonalLib.seasonalDescribeEntry. Clicking a row
        // opens that program's detail modal. Regular modal stays untouched.
        function SeasonalUpdateHistoryModal({ programs, onClose, onPickProgram }) {
            const modalRef = useModalFocus();
            const rows = (programs || [])
                .flatMap(p => (p.updates || []).map(e => ({ entry: e, p })))
                .sort((a, b) => (a.entry.date < b.entry.date ? 1 : -1))
                .slice(0, 100);
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e)=>e.stopPropagation()} style={{maxWidth:800}}
                        role="dialog" aria-modal="true" aria-label="Update History"
                        tabIndex={-1} ref={modalRef}>
                        <div className="modal-header" style={{position:'relative'}}>
                            <button className="modal-close-btn" onClick={onClose} aria-label="Close">×</button>
                            <h2 style={{fontSize:20, fontWeight:700, display:'flex', alignItems:'center', gap:8}}>
                                <span className="modal-title-icon" aria-hidden="true"><IconClipboard /></span>
                                Update History
                            </h2>
                        </div>
                        <div className="modal-body" style={{maxHeight:'60vh', overflowY:'auto'}}>
                            {rows.length === 0 ? (
                                <p style={{textAlign:'center', color:'var(--gray-500)', padding:40}}>
                                    No update history available.
                                </p>
                            ) : (
                                <table style={{width:'100%', borderCollapse:'collapse', fontSize:14}}>
                                    <thead>
                                        <tr style={{borderBottom:'2px solid var(--gray-300)', textAlign:'left'}}>
                                            <th style={{padding:'12px 8px', width:120}}>Date</th>
                                            <th style={{padding:'12px 8px'}}>Program</th>
                                            <th style={{padding:'12px 8px'}}>Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {rows.map(({ entry, p }, i) => (
                                            <tr key={i}
                                                style={{borderBottom:'1px solid var(--gray-200)', cursor:'pointer'}}
                                                role="button" tabIndex={0}
                                                aria-label={`Open ${p.university_name} details`}
                                                onClick={() => onPickProgram(p)}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter' || e.key === ' ') {
                                                        e.preventDefault();
                                                        onPickProgram(p);
                                                    }
                                                }}
                                                onMouseEnter={(e)=>e.currentTarget.style.backgroundColor='var(--gray-100)'}
                                                onMouseLeave={(e)=>e.currentTarget.style.backgroundColor='transparent'}>
                                                <td style={{padding:'12px 8px', color:'var(--gray-500)'}}>{entry.date}</td>
                                                <td style={{padding:'12px 8px', color:'var(--yonsei-blue)', fontWeight:600}}>
                                                    {p.university_name} — {p.program_name}
                                                </td>
                                                <td style={{padding:'12px 8px'}}>
                                                    {SeasonalLib.seasonalDescribeEntry(entry).join('; ')}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                        <div className="modal-footer">
                            <button className="btn btn-secondary" onClick={onClose}>Close</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
